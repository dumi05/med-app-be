spring:
  application:
    name: med-app-be
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/studiomedico-dc}
    username: ${DB_USERNAME:studiomedico}
    password: ${DB_PASSWORD:studiomedico}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-min-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  admin-psw: ${ADMIN_PSW:admin123}
  storage:
    dir: ${STORAGE_DIR:./data/attachments}
  security:
    max-failed-logins: ${MAX_FAILED_LOGINS:5}
    lockout-minutes: ${LOCKOUT_MINUTES:15}
  delegation:
    max-code-failures: ${MAX_DELEGATION_CODE_FAILURES:5}
    lock-minutes: ${DELEGATION_LOCK_MINUTES:15}
    access-minutes: ${DELEGATION_ACCESS_MINUTES:15}
  schedule:
    slot-minutes: ${SLOT_MINUTES:30}
    horizon-weeks: ${HORIZON_WEEKS:8}
    generation:
      cron: ${SLOT_GENERATION_CRON:0 0 2 * * *}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
